spring.application.name=mafia-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=86400000

livekit.api-key=${LIVEKIT_API_KEY:}
livekit.api-secret=${LIVEKIT_API_SECRET:}
livekit.url=${LIVEKIT_URL:}

# Ranked-mode rules. Edit these and restart the backend to change ranked games.
# (Intentionally no runtime endpoint for changing them.)
# These keys override the Java defaults in RankedConfig.java — editing the
# Java file alone has no effect at runtime.
ranked.player-count=4
ranked.mafia-count=1
ranked.include-sheriff=false
ranked.include-doctor=false
ranked.include-jester=false
ranked.include-mutilator=false
ranked.doctor-self-save-limit=1
ranked.sheriff-investigation-delay=0
ranked.night-duration-seconds=15
ranked.day-duration-seconds=20
ranked.voting-duration-seconds=15